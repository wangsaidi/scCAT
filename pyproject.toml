[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scCAT"
version = "1.0.0"
description = "Confidence-weighted adaptive triplet learning for single-cell batch integration"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mintong Chen" },
    { name = "[Corresponding author]", email = "[TBD]" },
]
keywords = [
    "single-cell",
    "scRNA-seq",
    "batch integration",
    "triplet learning",
    "batch-specific cells",
    "overcorrection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "torch>=1.13",
    "anndata>=0.9",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "adjustText>=1.0",
]
demo = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
"Homepage"      = "https://github.com/[USER]/scCAT"
"Bug Reports"   = "https://github.com/[USER]/scCAT/issues"
"Source"        = "https://github.com/[USER]/scCAT"
"Documentation" = "https://github.com/[USER]/scCAT/tree/main/docs"

[tool.setuptools]
packages = ["scCAT"]

[tool.setuptools.package-data]
scCAT = ["py.typed"]
